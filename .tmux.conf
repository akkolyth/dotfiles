set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

set -g prefix ^a
set -g default-terminal xterm-256color
set -g status-keys vi
set -g base-index 1

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind-key v split-window -h
bind-key h split-window -v
bind-key x kill-pane

bind -n S-Left  previous-window
bind -n S-Right next-window

set-option -g renumber-windows on

bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

bind-key y set-window-option synchronize-panes\; display-message "synchronize mode toggled."

bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

bind-key L clear-history

setw -g mode-keys vi
bind-key Escape copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel

# WSL clipboard
if-shell 'command -v clip.exe >/dev/null 2>&1' {
    set -s set-clipboard off
    set -s copy-command '{ printf "\377\376"; iconv -f UTF-8 -t UTF-16LE; } | clip.exe'
}

set -g mouse on

set-option -g display-time 3000
set-option -g display-panes-time 3000

set -g base-index 1
set-window-option -g pane-base-index 1

set-window-option -g automatic-rename on
set-option -g set-titles on

set-option -g repeat-time 0

set -sg escape-time 0

setw -g monitor-activity on
setw -g monitor-silence 0
setw -g monitor-bell off

set -g visual-activity off

set-window-option -g window-status-current-style fg=colour159
set-window-option -g window-status-style fg=colour109
set -g window-status-activity-style bold,fg=colour80

set-option -g message-style bg=colour237,fg=colour231
set-option -g pane-border-style fg=colour36
set-option -g pane-active-border-style fg=colour202

set -g status-justify centre
set -g status-style bg=colour234,fg=colour109
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-format ' #[fg=colour109]#I:#[fg=colour159]#W#[fg=colour80]#F '
set -g status-interval 60
set -g status-left-length 50
set -g status-left '#[fg=colour80] #S #[fg=colour123]#{?client_prefix,PREFIX ,}#{?#{==:#{pane_mode},copy-mode},COPY ,}#[default] '
set -g status-right-length 80
# Warsaw date, local time in each city
set -g status-right '#[fg=colour109] SF #[fg=colour123]#(TZ=America/Los_Angeles date +%%H:%%M)  #[fg=colour109]NYC #[fg=colour123]#(TZ=America/New_York date +%%H:%%M)  #[fg=colour109]WAW #[fg=colour159]#(LC_TIME=C TZ=Europe/Warsaw date "+%%a %%d %%b · %%H:%%M") '
set -sg escape-time 50

# Load plugins last
run '~/.tmux/plugins/tpm/tpm'
